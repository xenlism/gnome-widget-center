name: Build & deploy store
# Publishing = signing. The signing key lives ONLY in the `store-publish` Environment secret
# (Settings > Environments > store-publish: add "Required reviewers" so every publish needs a human click).
on:
  push:
    branches: [main]
    paths: ["widgets/**", "themepacks/**", "catalogs.json", "store.config.json", "revoked.json", "authors.json", "site/**", "tools/**"]
  schedule:
    - cron: "17 3 * * 1"          # weekly re-publish: renews `expires` so a healthy store never looks abandoned
  workflow_dispatch:
    inputs:
      first_publish:
        description: "First ever publish (no live store.json yet)"
        type: boolean
        default: false
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: false }     # never cancel a publish half-way
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: store-publish, url: "${{ steps.deploy.outputs.page_url }}" }
    permissions: { contents: read, pages: write, id-token: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
        with: { fetch-depth: 0 }          # git log dates -> "updated"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065      # v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes --no-deps -r tools/requirements.txt
      - run: test ! -d tests || python -m unittest discover -s tests          # tools tests; a freshly created repo has none
      - name: Build, sign, self-verify
        env:
          GWC_SIGNING_KEY: ${{ secrets.GWC_SIGNING_KEY }}
          FIRST: ${{ inputs.first_publish }}
        run: |
          if [ "$FIRST" = "true" ]; then EXTRA="--first-publish"; else EXTRA="--prev-url auto"; fi
          python tools/build_store.py --out dist $EXTRA
          python tools/verify_store.py dist
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e          # v4
